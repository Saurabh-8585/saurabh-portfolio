<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Saurabh Khatmode</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Archivo:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFAF5;--ink:#15151C;--ink-soft:#4A4A58;--red:#E0202F;--red-deep:#B30E1E;--blue:#2342D6;--yellow:#FFC400}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:22px;background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(21,21,28,.1) 1px,transparent 1.4px);background-size:14px 14px;pointer-events:none}
body>*{position:relative}
.tag{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--blue)}
h1{font-family:'Bangers',cursive;font-weight:400;font-size:clamp(110px,26vw,260px);line-height:.9;letter-spacing:.02em;color:var(--red);
text-shadow:2px 2px 0 var(--red-deep),4px 4px 0 var(--red-deep),6px 6px 0 var(--red-deep),8px 8px 0 var(--ink),12px 12px 0 rgba(21,21,28,.18)}
.msg{font-family:'Bangers',cursive;font-size:clamp(22px,4vw,36px);letter-spacing:.05em;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:10px 26px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1deg)}
p{max-width:460px;color:var(--ink-soft);font-weight:500}
.btn{font-family:'Bangers',cursive;font-size:20px;letter-spacing:.08em;padding:14px 32px;border-radius:14px;border:3px solid var(--ink);background:var(--red);color:#fff;text-decoration:none;box-shadow:5px 5px 0 var(--ink);transition:.25s}
.btn:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:9px 9px 0 var(--ink)}
</style>
</head>
<body>
  <div class="tag">// Error — Route Not Found</div>
  <h1>404</h1>
  <div class="msg">This deployment doesn't exist!</div>
  <p>The page you're looking for was moved, deleted, or never provisioned.</p>
  <a class="btn" href="/">Back to Home</a>
</body>
</html>
